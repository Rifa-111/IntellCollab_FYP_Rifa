name: Offline demonstrator tests
on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Python syntax
        run: python -m compileall -q intellcollab tests
      - name: Run deterministic offline tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic demonstration
        run: python -m intellcollab
